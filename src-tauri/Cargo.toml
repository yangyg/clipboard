[package]
name = "clipboard"
version = "0.1.0"
description = "Windows Clipboard Manager"
authors = ["Clipboard"]
edition = "2021"

[lib]
name = "clipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-global-shortcut = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
parking_lot = "0.12"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
image = "0.25"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-autostart = "=2.2.0"
tauri-plugin-single-instance = "=2.2.4"
font-kit = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
] }

# Clippy policy: the DB/IPC layers intentionally pass SQL/command parameters
# positionally (up to 11 args) because they mirror IPC payloads 1:1. Restructure
# into parameter structs only when the parameter list itself changes; keep all
# other lints at deny level (enforced locally via `npm run clippy` and in CI).
[lints.clippy]
too_many_arguments = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1
