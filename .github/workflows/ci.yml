name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint · type-check · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # lockfile resolved URLs point to registry.npmmirror.com (maintainer's
        # local registry). replace-registry-host rewrites them to the runner's
        # registry so CI doesn't depend on the mirror; integrity is still enforced.
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=registry.npmmirror.com

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Schema compatibility check
        run: npm run check:schema

      - name: IPC contract check
        run: npm run check:ipc-contract

  backend:
    name: Rust (clippy · test)
    # The app targets Windows (clipboard polling, DWM/tray/theme APIs are
    # cfg(windows)); tests must compile on the real target OS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Must match channel in rust-toolchain.toml, otherwise cargo's override
      # would download a second toolchain on the runner.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy (warnings as errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  package:
    name: Windows package (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        # See the frontend job: fetch from npmjs.org instead of the npmmirror
        # resolved URLs baked into package-lock.json.
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=registry.npmmirror.com

      # Must match channel in rust-toolchain.toml (see backend job).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri bundle
        run: npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
